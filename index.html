<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardín Maternal Bambini | Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Estilos específicos para el Navbar de la página principal */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8f9fa;
            padding: 15px 30px;
            border-bottom: 1px solid #dee2e6;
            flex-wrap: wrap;
            /* Permite que los elementos se ajusten en pantallas pequeñas */
        }

        .navbar .btn-primary {
            padding: 12px 30px;
            text-decoration: none;
            cursor: pointer;
            margin: 5px;
            /* Espacio entre los botones/selectores */
        }

        .reporte-mensual-controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .reporte-mensual-controls label {
            margin-right: 10px;
            font-weight: bold;
            color: #343a40;
        }

        .reporte-mensual-controls input[type="month"] {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>👶 Jardín Maternal Bambini</h1>
            <p>Dashboard de Estadísticas</p>
            <button class="btn btn-danger" onclick="borrarTodoLocalStorage()"
                style="padding: 5px 15px; font-size: 0.9em; margin-left: 20px;">
                🗑️ Borrar Todos los Datos
            </button>
        </header>

        <div class="navbar">

            <div class="reporte-mensual-controls">
                <label for="selectorReporteMensual">Reporte Mensual:</label>
                <input type="month" id="selectorReporteMensual" value="2025-10">
                <button class="btn btn-primary" style="background: #FF6900; border: none;"
                    onclick="descargarReporteMensualPDF()">
                    ⬇️ Generar PDF
                </button>
            </div>
            <a class="btn btn-primary" onclick="solicitarAccesoGestion()" style="background: #6c757d;">
                🛠️ Ir a Gestión de Datos
            </a>
        </div>

        <div class="content">
            <div id="estadisticas" class="section active">
                <h2>📈 Resumen de la Gestión</h2>
                <div class="cards-grid" id="resumenEstadisticas">
                </div>

                <h2 style="margin-top: 40px;">⏱️ Horas Trabajadas por Maestro (Última Semana)</h2>
                <table class="asistencia-table" id="tablaHorasTrabajadas">
                    <thead>
                        <tr>
                            <th>Maestro</th>
                            <th>Lunes</th>
                            <th>Martes</th>
                            <th>Miércoles</th>
                            <th>Jueves</th>
                            <th>Viernes</th>
                            <th>Total Semanal</th>
                        </tr>
                    </thead>
                    <tbody id="bodyHorasTrabajadas">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/scripts.js"></script>

    <script>
        // Función de solicitud de acceso (si la usas)
        function solicitarAccesoGestion() {
            const claveIngresada = prompt("Ingresa la clave de acceso para ir a Gestión de Datos:");
            if (claveIngresada === "admin") {
                window.location.href = 'gestion.html'; // Asegúrate que la ruta sea correcta
            } else if (claveIngresada !== null) {
                alert('🚫 Clave incorrecta.');
            }
        }

        // --- INICIALIZACIÓN Y LÓGICA DE CARGA ---

        // Establecer el valor predeterminado del selector al mes actual
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = today.getFullYear();
            const selector = document.getElementById('selectorReporteMensual');
            if (selector) {
                selector.value = `${year}-${month}`;
            }
        });

        // Llamada para iniciar la carga de datos (Se ejecuta después de que el DOM esté listo)
        window.onload = function () {
            // Llama a la función asíncrona de carga de datos definida en scripts.js
            cargarDatosIniciales();
        };
    </script>
</body>

</html>
